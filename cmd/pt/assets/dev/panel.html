<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pt dev：本機假平台</title>
<style>
  :root { --bg: #fffaf3; --card: #fff; --text: #1f2430; --muted: #687080; --border: #e6e1d8; --accent: #1f6feb; --danger: #c93c37; --ok: #1a7f37; --warn: #9a6700; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.6 system-ui, -apple-system, "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  h2 { font-size: 1rem; margin: 0 0 10px; }
  p.lead { margin: 0 0 16px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-bottom: 12px; }
  section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  button, a.btn { font: inherit; border: 1px solid var(--border); background: #fff; color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; text-decoration: none; display: inline-block; }
  button:hover, a.btn:hover { border-color: var(--accent); color: var(--accent); }
  button.danger { color: var(--danger); }
  button.on { background: var(--danger); border-color: var(--danger); color: #fff; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .muted { color: var(--muted); }
  .tag { font-size: 12px; border-radius: 99px; padding: 1px 8px; background: #eef2f7; color: var(--muted); }
  .tag.ok { background: #e6f4ea; color: var(--ok); }
  .tag.bad { background: #fde8e7; color: var(--danger); }
  .tag.warn { background: #fff4d6; color: var(--warn); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; border-top: none; }
  td.st { white-space: nowrap; }
  .hint { color: var(--danger); font-size: 12px; }
  .players li { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--border); }
  .players li:first-child { border-top: none; }
  .players { list-style: none; margin: 0 0 10px; padding: 0; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .log-wrap { max-height: 480px; overflow: auto; }
</style>
</head>
<body>
<main>
  <h1>pt dev：本機假平台</h1>
  <p class="lead">這頁代替玩聚平台：發啟動碼、回應遊戲伺服器的 API 並驗證簽章。用下面的按鈕模擬房主與平台的狀態，確認你的遊戲伺服器處理正確。只在本機，不會連到真的玩聚。</p>

  <div class="grid">
    <section>
      <h2>房間</h2>
      <p id="room" class="muted">載入中…</p>
      <div class="row">
        <button data-act="restart" title="房主按「重新開始」：局數加一，所有人重新載入、拿新的啟動碼">重新開始</button>
        <button data-act="close" class="danger" title="房主或管理員關閉房間">關閉房間</button>
        <button data-act="new-room" title="關房後開一間新的房間">開新房間</button>
      </div>
      <p class="muted" style="margin:10px 0 0">遊戲伺服器每次查成員才會知道（範本預設 10 秒一次）。</p>
    </section>

    <section>
      <h2>平台狀態</h2>
      <div class="row" style="margin-bottom:8px">
        <button id="down" data-act="down" title="平台 API 回 503：遊戲伺服器應該讓已在房間的人繼續玩、一段時間後拒絕新加入">平台連不到</button>
        <button id="skew" data-act="skew" title="平台時鐘快 6 分鐘：所有簽章會被拒絕（clock_skew）">時鐘偏差 6 分鐘</button>
      </div>
      <div id="health"></div>
    </section>
  </div>

  <section style="margin-bottom:12px">
    <h2>玩家</h2>
    <ul id="players" class="players"></ul>
    <div class="row">
      <button id="add">新增玩家（開新分頁）</button>
      <span class="muted">同一位玩家重新整理分頁，會拿新的啟動碼回到原座位。</span>
    </div>
  </section>

  <section>
    <h2>遊戲伺服器的呼叫紀錄</h2>
    <div class="log-wrap">
      <table>
        <thead><tr><th>時間</th><th>端點</th><th>狀態</th><th>結果</th></tr></thead>
        <tbody id="log"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
  // 所有資料都用 textContent 放進頁面
  const $ = (id) => document.getElementById(id);
  const el = (tag, text, cls) => { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; };
  let site = '';
  let self = '';
  let after = 0;
  let players = [];
  const rows = [];

  async function control(action, player) {
    await fetch('/dev/control', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, player }) });
    refresh();
  }

  function playerURL(code) {
    const u = new URL(site);
    u.searchParams.set('pt_dev', self);
    u.searchParams.set('pt_player', code);
    return u.toString();
  }

  document.querySelectorAll('button[data-act]').forEach((b) => b.addEventListener('click', () => control(b.dataset.act)));
  $('add').addEventListener('click', () => {
    let n = players.length + 1;
    while (players.some((p) => p.code === 'p' + n)) n++;
    window.open(playerURL('p' + n), '_blank');
    setTimeout(refresh, 800);
  });

  function render(s) {
    players = s.players || [];
    $('room').textContent = `房號 ${s.room.id}・第 ${s.room.epoch} 局・${s.room.open ? '開放中' : '已關閉'}`;
    $('down').classList.toggle('on', s.down);
    $('down').textContent = s.down ? '平台連不到（點一下恢復）' : '平台連不到';
    $('skew').classList.toggle('on', s.skewSeconds !== 0);
    $('skew').textContent = s.skewSeconds !== 0 ? '時鐘偏差 6 分鐘（點一下恢復）' : '時鐘偏差 6 分鐘';

    const list = $('players');
    list.replaceChildren();
    if (!players.length) list.append(el('li', '還沒有玩家。按「新增玩家」開一個分頁。', 'muted'));
    for (const p of players) {
      const li = el('li');
      li.append(el('strong', p.name), el('code', p.code));
      if (p.host) li.append(el('span', '房主', 'tag'));
      li.append(p.kicked ? el('span', '已被踢出', 'tag bad') : p.joined ? el('span', '已加入', 'tag ok') : el('span', '還沒兌換啟動碼', 'tag'));
      const open = el('a', '開啟分頁', 'btn');
      open.href = playerURL(p.code);
      open.target = '_blank';
      const kick = el('button', p.kicked ? '取消踢出' : '踢出', p.kicked ? '' : 'danger');
      kick.addEventListener('click', () => control(p.kicked ? 'unkick' : 'kick', p.code));
      li.append(open, kick);
      list.append(li);
    }

    const health = $('health');
    health.replaceChildren();
    const poll = el('p');
    poll.style.margin = '0 0 4px';
    if (!s.pollSeconds) poll.append(el('span', '查成員：還沒有紀錄', 'tag'));
    else poll.append(el('span', `查成員：約每 ${s.pollSeconds.toFixed(1)} 秒一次`, s.pollSeconds <= 15 ? 'tag ok' : 'tag warn'),
      ...(s.pollSeconds > 15 ? [el('span', ' 間隔太長：被踢的人要等很久才會斷線（建議 10 秒）', 'hint')] : []));
    health.append(poll);

    for (const c of s.calls || []) {
      rows.unshift(c);
      after = Math.max(after, c.seq);
    }
    rows.splice(300);
    const failed = rows.filter((c) => c.hint).length;
    const sig = el('p');
    sig.style.margin = '0';
    sig.append(failed ? el('span', `簽章或格式錯誤 ${failed} 次（看下面紀錄）`, 'tag bad') : el('span', '簽章：目前沒有錯誤', 'tag ok'));
    health.append(sig);

    const body = $('log');
    body.replaceChildren();
    for (const c of rows) {
      const tr = el('tr');
      const res = el('td');
      res.append(el('div', c.result));
      if (c.hint) res.append(el('div', c.hint, 'hint'));
      tr.append(el('td', new Date(c.at).toLocaleTimeString('zh-TW', { hour12: false }), 'st'), el('td', c.endpoint),
        el('td', String(c.status), 'st'), res);
      tr.style.color = c.status >= 400 ? 'var(--danger)' : '';
      body.append(tr);
    }
  }

  async function refresh() {
    try {
      const s = await (await fetch('/dev/state?after=' + after)).json();
      site = s.site;
      self = s.self;
      render(s);
    } catch {
      $('room').textContent = 'pt dev 已經結束';
    }
  }
  refresh();
  setInterval(refresh, 1000);
</script>
</body>
</html>
